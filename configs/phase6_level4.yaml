## Phase 6 — Level 4: Full Publication-Ready Experiment Campaign
## All baselines + OpcodeGT v2 ablations × 5 seeds × early stopping
## Target: IEEE Transactions-level reproducible results

main_benchmark:
  swc_ids: [101, 103, 104, 107, 113, 114, 115, 120, 128, 132, 135]

inputs:
  phase4_config_yaml: configs/phase4.yaml
  phase5_config_yaml: configs/phase5.yaml
  variant_manifests_dir: data/splits/main_benchmark/manifests/phase2_task5_20260316T081319Z

matrix:
  opcodegt_modes:
    - fused
    - graph_only
    - opcode_only
  baselines:
    - classical_graph_lr
    - classical_xgboost
    - classical_rf
    - classical_lgbm
    - mlp_opcode
    - mlp_graph
    - mlp_fusion_concat
    - codebert_classifier
    - gcn_baseline
    - gat_baseline
    - bilstm_baseline
  dataset_variants:
    - clean_default
  seeds:
    - 42
    - 123
    - 456
    - 789
    - 2024

training:
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.01
  max_steps: 5000
  num_workers: 0
  device: cuda
  decision_threshold: 0.5
  # Early stopping configuration
  eval_every: 250
  patience: 15
  early_stopping: true
  run_timeout_seconds: 3600

execution:
  resume: true
  rerun_failed: true
  fail_fast: false

models:
  opcodegt:
    hidden_dim: 256
    dropout: 0.1
    architecture: opcodegt_v2
    use_hmpgt: true
    use_cross_attention: true
    use_label_attention: true
    cfg_only: false
    num_heads: 8
    num_edge_types: 9
    num_gnn_layers: 3
  opcodegt_ablation:
    variants:
      - name: v2_full
        mode: fused
        architecture: opcodegt_v2
        use_hmpgt: true
        use_cross_attention: true
        use_label_attention: true
        cfg_only: false
      - name: v2_no_hmpgt
        mode: fused
        architecture: opcodegt_v2
        use_hmpgt: false
        use_cross_attention: true
        use_label_attention: true
        cfg_only: false
      - name: v2_no_cross_attention
        mode: fused
        architecture: opcodegt_v2
        use_hmpgt: true
        use_cross_attention: false
        use_label_attention: true
        cfg_only: false
      - name: v2_no_label_attention
        mode: fused
        architecture: opcodegt_v2
        use_hmpgt: true
        use_cross_attention: true
        use_label_attention: false
        cfg_only: false
      - name: v2_cfg_only
        mode: fused
        architecture: opcodegt_v2
        use_hmpgt: true
        use_cross_attention: true
        use_label_attention: true
        cfg_only: true
      - name: v1_simple_gin_fusion
        mode: fused
        architecture: simple_gin_fusion
  mlp:
    hidden_dim: 256
    dropout: 0.1
  classical:
    max_iter: 300
    C: 1.0
    solver: liblinear
    random_state: 42

enriched_features:
  tfidf_features_parquet: data/features/main_benchmark/tfidf_features.parquet
  pattern_features_parquet: data/features/main_benchmark/pattern_features.parquet

outputs:
  checkpoint_root: checkpoints/phase6_level4
  models_dir: checkpoints/phase6_level4/models
  metrics_dir: checkpoints/phase6_level4/metrics
  report_dir: reports/phase6_level4
  run_manifest_json: reports/phase6_level4/phase6_run_manifest.json
  results_summary_json: reports/phase6_level4/results_summary.json
  ablation_summary_json: reports/phase6_level4/ablation_summary.json
  per_swc_metrics_parquet: reports/phase6_level4/per_swc_metrics.parquet
  final_tables_md: reports/phase6_level4/final_tables.md
  figures_dir: reports/phase6_level4/figures
