main_benchmark:
  swc_ids: [101, 103, 104, 107, 113, 114, 115, 120, 128, 132, 135]

run:
  mode: full

inputs:
  phase3_run_manifest_json: reports/phase3/phase3_run_manifest.json

model:
  mode: fused
  hidden_dim: 256
  dropout: 0.1
  use_gnn: true
  num_gnn_layers: 3

training:
  batch_size: 64
  lr: 0.0005
  weight_decay: 0.01
  max_steps: 3000
  device: cuda
  seed: 42
  num_workers: 0

outputs:
  checkpoint_dir: checkpoints/phase4
  model_spec_md: reports/phase4/model_spec.md
  report_json: reports/phase4/phase4_train_report.json
  run_manifest_json: reports/phase4/phase4_full_run_manifest.json
