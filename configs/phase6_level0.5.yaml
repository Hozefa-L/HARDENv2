main_benchmark:
  swc_ids:
  - 101
  - 103
  - 104
  - 107
  - 113
  - 114
  - 115
  - 120
  - 128
  - 132
  - 135
inputs:
  phase4_config_yaml: configs/phase4.yaml
  phase5_config_yaml: configs/phase5.yaml
  variant_manifests_dir: data/splits/main_benchmark/manifests/phase2_task5_20260316T081319Z
matrix:
  opcodegt_modes:
  - opcode_only
  - graph_only
  - fused
  baselines:
  - classical_graph_lr
  - classical_xgboost
  - classical_rf
  - mlp_opcode
  - mlp_graph
  - mlp_fusion_concat
  dataset_variants:
  - clean_default
  seeds:
  - 42
training:
  batch_size: 64
  lr: 0.0005
  weight_decay: 0.01
  max_steps: 500
  num_workers: 0
  device: cuda
  decision_threshold: 0.5
execution:
  resume: true
  rerun_failed: true
  fail_fast: false
models:
  opcodegt:
    hidden_dim: 256
    dropout: 0.1
  mlp:
    hidden_dim: 256
    dropout: 0.1
  classical:
    max_iter: 300
    C: 1.0
    solver: liblinear
    random_state: 42
enriched_features:
  tfidf_features_parquet: data/features/main_benchmark/tfidf_features.parquet
  pattern_features_parquet: data/features/main_benchmark/pattern_features.parquet
outputs:
  checkpoint_root: checkpoints/phase6_level0.5
  models_dir: checkpoints/phase6_level0.5/models
  metrics_dir: checkpoints/phase6_level0.5/metrics
  report_dir: reports/phase6_level0.5
  run_manifest_json: reports/phase6_level0.5/phase6_run_manifest.json
  results_summary_json: reports/phase6_level0.5/results_summary.json
  ablation_summary_json: reports/phase6_level0.5/ablation_summary.json
  per_swc_metrics_parquet: reports/phase6_level0.5/per_swc_metrics.parquet
  final_tables_md: reports/phase6_level0.5/final_tables.md
  figures_dir: reports/phase6_level0.5/figures
